apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-prueba
  template:
    metadata:
      labels:
        app: nginx-prueba
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80